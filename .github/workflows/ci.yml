# Commonplace CI — three INDEPENDENT jobs, each gating its own layer and failing on its own.
# There is deliberately NO combined status gate / blended score: `node`, `python-eval`, and
# `promptfoo-replay` run in parallel and each surfaces its own pass/fail (evaluation-methodology:
# per-layer results only). The promptfoo slice is keyless and deterministic ($0), so it needs no
# secrets and runs on every commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Layer 1 — the TypeScript engine + MV3 shell: types, unit tests, spike test, bundle.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test src/capture.test.js
      - run: npm run build
      # Key-exposure regression test (SPEC §25) — runs against the built dist/ on every commit.
      - name: Audit dist
        run: npm run audit

  # Layer 2 — the Phase-1 Python harness keeps gating the schemas/SHACL (untouched by Task 8).
  python-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest schema/SHACL suite
        run: cd eval && uv sync && uv run pytest -q

  # Layer 3 — SPEC §15 zero-cost frozen replay slice (keyless: the provider IS the replay).
  promptfoo-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run eval:promptfoo
