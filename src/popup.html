<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonplace</title>
    <style>
      /* ── Paper & Proof tokens (system fonts; strict-CSP-safe, no external resources) ──────────── */
      :root {
        --paper: oklch(0.965 0.01 90);
        --panel: oklch(0.99 0.008 90);
        --ink: oklch(0.23 0.015 60);
        --ink-soft: oklch(0.48 0.02 65);
        --ink-faint: oklch(0.62 0.015 65);
        --rule: oklch(0.9 0.012 80);
        --rule-strong: oklch(0.82 0.015 75);
        --accent: oklch(0.5 0.13 30); /* madder red — rubrication ink, used sparingly */
        --accent-ink: oklch(0.99 0.01 90);
        --accent-wash: oklch(0.94 0.045 35);
        --amber: oklch(0.72 0.13 70);
        --amber-wash: oklch(0.95 0.06 80);
        --good: oklch(0.55 0.1 150);
        --danger: oklch(0.5 0.17 25);
        --danger-wash: oklch(0.93 0.06 25);
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: oklch(0.21 0.01 60); /* "den" ground */
          --panel: oklch(0.25 0.012 60);
          --ink: oklch(0.92 0.01 85);
          --ink-soft: oklch(0.74 0.015 80);
          --ink-faint: oklch(0.6 0.015 75);
          --rule: oklch(0.32 0.012 60);
          --rule-strong: oklch(0.4 0.015 60);
          --accent: oklch(0.66 0.15 32);
          --accent-ink: oklch(0.16 0.01 60);
          --accent-wash: oklch(0.32 0.06 32);
          --amber: oklch(0.78 0.13 75);
          --amber-wash: oklch(0.33 0.05 75);
          --good: oklch(0.7 0.12 150);
          --danger: oklch(0.68 0.16 25);
          --danger-wash: oklch(0.32 0.07 25);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 384px;
        max-height: 580px;
        overflow-y: auto;
        font: 13px/1.5 var(--sans);
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { padding: 14px 16px 16px; }

      /* ── Action-needed / halt banner ────────────────────────────────────────────────────────── */
      .banner {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 11px 12px;
        border-radius: 9px;
        margin-bottom: 13px;
        border: 1px solid var(--accent);
        background: var(--accent-wash);
      }
      .banner[data-kind="halt"] { border-color: var(--danger); background: var(--danger-wash); }
      .banner .glyph { font-size: 16px; line-height: 1.35; }
      .banner .body { flex: 1; min-width: 0; }
      .banner .b-title {
        font-weight: 700; font-size: 12px; letter-spacing: 0.02em;
        text-transform: uppercase; color: var(--accent); margin-bottom: 2px;
      }
      .banner[data-kind="halt"] .b-title { color: var(--danger); }
      .banner .b-reason { color: var(--ink); font-size: 12.5px; }
      .banner .b-resume { margin-top: 9px; }

      /* ── Header ─────────────────────────────────────────────────────────────────────────────── */
      header { margin-bottom: 12px; }
      .brand {
        font-family: var(--serif); font-size: 15px; font-weight: 600;
        letter-spacing: 0.01em; color: var(--ink-soft);
      }
      .count {
        font-family: var(--serif); font-size: 22px; line-height: 1.15; margin-top: 2px;
        color: var(--ink); font-variant-numeric: tabular-nums;
      }

      /* ── State line ─────────────────────────────────────────────────────────────────────────── */
      .stateline {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px;
        background: var(--panel); margin-bottom: 12px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); flex: none; }
      .dot[data-tone="active"] { background: var(--amber); animation: pulse 1.3s ease-in-out infinite; }
      .dot[data-tone="warn"] { background: var(--accent); }
      .dot[data-tone="error"] { background: var(--danger); }
      .dot[data-tone="done"] { background: var(--good); }
      .dot[data-tone="idle"], .dot[data-tone="neutral"] { background: var(--ink-faint); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .state-label { font-weight: 600; flex: 1; }
      .conn { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
      .conn[data-conn="live"] { display: none; }

      /* ── Per-source rows ────────────────────────────────────────────────────────────────────── */
      .sources { list-style: none; margin: 0 0 13px; padding: 0; }
      .sources li {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 2px; border-bottom: 1px solid var(--rule);
      }
      .sources li:last-child { border-bottom: 0; }
      .s-mark { width: 16px; text-align: center; flex: none; font-size: 12px; color: var(--ink-faint); }
      li[data-state="done"] .s-mark { color: var(--good); }
      li[data-state="current"] .s-mark { color: var(--amber); }
      .s-name { flex: 1; }
      li[data-state="pending"] .s-name { color: var(--ink-faint); }
      .s-detail { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      li[data-state="current"] .s-detail { color: var(--amber); }
      .spinner {
        display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px;
        border: 1.5px solid var(--amber); border-top-color: transparent; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Controls ───────────────────────────────────────────────────────────────────────────── */
      .controls { display: flex; gap: 8px; margin-bottom: 12px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; border-radius: 7px;
        padding: 9px 14px; border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink);
      }
      button:hover:not(:disabled) { border-color: var(--ink-faint); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button.primary:hover:not(:disabled) { filter: brightness(1.06); }
      button.ghost { flex: 1; }
      .banner .b-resume button { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      /* ── Footer links ───────────────────────────────────────────────────────────────────────── */
      footer { display: flex; gap: 16px; border-top: 1px solid var(--rule); padding-top: 11px; }
      .link {
        border: 0; background: none; padding: 0; font: inherit; font-weight: 500;
        color: var(--ink-soft); cursor: pointer; text-decoration: none;
      }
      .link:hover { color: var(--accent); text-decoration: underline; }
      .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

      /* ── Toast ──────────────────────────────────────────────────────────────────────────────── */
      .toast {
        position: sticky; bottom: 0; margin-top: 10px;
        background: var(--ink); color: var(--paper); font-size: 12px;
        padding: 8px 11px; border-radius: 7px; text-align: center;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="banner" id="banner" role="alert" hidden>
        <span class="glyph" id="bannerGlyph" aria-hidden="true">⚠</span>
        <div class="body">
          <div class="b-title" id="bannerTitle"></div>
          <div class="b-reason" id="bannerReason"></div>
          <div class="b-resume" id="bannerResumeWrap" hidden>
            <button type="button" id="bannerResume">Resume</button>
          </div>
        </div>
      </div>

      <header>
        <div class="brand">Commonplace</div>
        <div class="count" id="count">…</div>
      </header>

      <div class="stateline">
        <span class="dot" id="stateDot" data-tone="neutral" aria-hidden="true"></span>
        <span class="state-label" id="stateLabel" role="status" aria-live="polite">Starting…</span>
        <span class="conn" id="conn" data-conn="connecting">connecting</span>
      </div>

      <ul class="sources" id="sources" aria-label="Capture progress by source"></ul>

      <div class="controls">
        <button type="button" id="btnStart" class="primary" hidden>Start capture</button>
        <button type="button" id="btnResume" class="primary" hidden>Resume</button>
        <button type="button" id="btnPause" class="ghost" hidden>Pause</button>
        <button type="button" id="btnStop" class="ghost" hidden>Stop</button>
      </div>

      <footer>
        <button type="button" class="link" id="btnLibrary">Search library</button>
        <button type="button" class="link" id="btnSettings">Settings</button>
        <button type="button" class="link" id="btnExport">Export library</button>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
