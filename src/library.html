<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonplace — Library</title>
    <style>
      /* Deliberately plain, legibility-only. The Paper & Proof design system lands in `library-ui`
         behind the G2 gate — this surface exists so the product is usable and the MCP demo has a face.
         A minimal subset of the same tokens keeps it theme-aware and not jarring next to the popup. */
      :root {
        --paper: oklch(0.965 0.01 90);
        --panel: oklch(0.99 0.008 90);
        --ink: oklch(0.23 0.015 60);
        --ink-soft: oklch(0.48 0.02 65);
        --ink-faint: oklch(0.62 0.015 65);
        --rule: oklch(0.9 0.012 80);
        --rule-strong: oklch(0.82 0.015 75);
        --accent: oklch(0.5 0.13 30);
        --accent-ink: oklch(0.99 0.01 90);
        --mark: oklch(0.9 0.11 95);
        --chip: oklch(0.94 0.02 80);
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: oklch(0.21 0.01 60);
          --panel: oklch(0.25 0.012 60);
          --ink: oklch(0.92 0.01 85);
          --ink-soft: oklch(0.74 0.015 80);
          --ink-faint: oklch(0.6 0.015 75);
          --rule: oklch(0.32 0.012 60);
          --rule-strong: oklch(0.4 0.015 60);
          --accent: oklch(0.66 0.15 32);
          --accent-ink: oklch(0.16 0.01 60);
          --mark: oklch(0.55 0.11 95);
          --chip: oklch(0.3 0.015 70);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font: 15px/1.55 var(--sans);
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 26px 20px 80px; }

      header { margin-bottom: 18px; }
      .brand { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink-soft); }
      .search {
        margin-top: 12px; width: 100%; font: 17px var(--sans); color: var(--ink);
        padding: 12px 14px; border: 1px solid var(--rule-strong); border-radius: 10px;
        background: var(--panel);
      }
      .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
      .meta { margin-top: 8px; font-size: 13px; color: var(--ink-faint); font-family: var(--mono); }

      /* ── Results ─────────────────────────────────────────────────────────────── */
      ul.results { list-style: none; margin: 16px 0 0; padding: 0; }
      .card {
        display: flex; gap: 14px; padding: 13px; margin-bottom: 10px;
        border: 1px solid var(--rule); border-radius: 10px; background: var(--panel);
        cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit;
      }
      .card:hover { border-color: var(--ink-faint); }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .thumb {
        width: 74px; height: 98px; flex: none; border-radius: 6px; object-fit: cover;
        background: var(--chip); border: 1px solid var(--rule);
      }
      .thumb.empty { display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 22px; }
      .card-body { flex: 1; min-width: 0; }
      .snippet { font-size: 14.5px; color: var(--ink); }
      .snippet .none { color: var(--ink-faint); font-style: italic; }
      mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
      .chips { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
      .chip {
        font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
        background: var(--chip); color: var(--ink-soft); font-family: var(--mono);
      }
      .prov {
        margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px;
        font-size: 12px; color: var(--ink-faint); font-family: var(--mono);
      }
      .prov .lbl { color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }

      .empty-state {
        margin-top: 40px; text-align: center; color: var(--ink-faint);
      }
      .empty-state .big { font-family: var(--serif); font-size: 18px; color: var(--ink-soft); }

      /* ── Detail view ─────────────────────────────────────────────────────────── */
      .back {
        border: 0; background: none; padding: 0; font: inherit; font-weight: 600;
        color: var(--accent); cursor: pointer; margin-bottom: 16px;
      }
      .detail { display: flex; gap: 20px; }
      .detail .thumb { width: 150px; height: 200px; }
      .detail-body { flex: 1; min-width: 0; }
      .detail h2 { font-family: var(--serif); font-weight: 600; font-size: 17px; margin: 0 0 4px; }
      .strip {
        margin: 14px 0; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden;
      }
      .strip .row {
        display: flex; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--rule);
        font-size: 13px;
      }
      .strip .row:last-child { border-bottom: 0; }
      .strip .k {
        flex: none; width: 120px; color: var(--accent); font-family: var(--mono);
        font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding-top: 1px;
      }
      .strip .v { color: var(--ink); word-break: break-word; }
      .strip .v a { color: var(--accent); }
      .layer { margin-top: 16px; }
      .layer h3 {
        font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--ink-faint); margin: 0 0 5px;
      }
      .layer p { margin: 0 0 8px; white-space: pre-wrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">Commonplace — Library</div>
        <input
          id="search"
          class="search"
          type="search"
          autocomplete="off"
          placeholder="Search what's IN your saved videos — captions, transcripts, on-screen text, entities…"
          aria-label="Search your library"
        />
        <div class="meta" id="meta">Loading your library…</div>
      </header>

      <ul class="results" id="results" aria-live="polite"></ul>
      <div class="empty-state" id="emptyState" hidden></div>
      <section id="detail" hidden></section>
    </div>

    <script type="module" src="library.js"></script>
  </body>
</html>
